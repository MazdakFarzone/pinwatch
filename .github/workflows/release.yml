name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test CLI
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run tests
        run: make test

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            emulated: false
          - arch: armhf
            platform: linux/arm/v7
            runner: ubuntu-24.04
            emulated: true
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up ARM emulation
        if: ${{ matrix.emulated }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build Bookworm-compatible packages
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          docker run --rm \
            --platform "$RELEASE_PLATFORM" \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            debian:bookworm-slim \
            ./scripts/build-release.sh "$version" "$RELEASE_ARCH" /src/dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: pinwatch-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          LC_ALL=C sha256sum pinwatch-*.tar.gz pinwatch_*.deb > SHA256SUMS

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="pinwatch ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "$title" \
              --generate-notes
          fi
